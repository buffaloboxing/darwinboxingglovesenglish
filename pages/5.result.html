<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-8">
    <title>5. Result | BUFFALO BOXING</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            padding: 40px 20px; 
            max-width: 750px; 
            margin: 0 auto; 
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
        }
        .page-frame {
            background: #ffffff;
            border: 1px solid #1a1a1a;
            border-radius: 2px;
            padding: 48px 40px;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 48px;
            padding-bottom: 24px;
            border-bottom: 1px solid #1a1a1a;
        }
        .brand-name {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 3px;
            color: #1a1a1a;
        }
        .brand-series {
            font-size: 11px;
            letter-spacing: 4px;
            color: #666;
            margin-top: 6px;
            text-transform: uppercase;
        }
        .page-title { 
            font-size: 20px; 
            font-weight: 500; 
            margin-bottom: 24px;
            color: #1a1a1a;
            letter-spacing: 1px;
        }
        .final-price {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1a1a1a;
        }
        .final-price span {
            font-size: 28px;
            color: #1a1a1a;
        }
        .summary-box {
            padding: 20px;
            background: #fafafa;
            border-radius: 2px;
            margin-bottom: 32px;
            border: 1px solid #d9d9d9;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .summary-item:last-child {
            border-bottom: none;
        }
        .summary-label {
            font-size: 14px;
            color: #666;
        }
        .summary-value {
            font-size: 14px;
            color: #1a1a1a;
            font-weight: 500;
        }
        .copy-result {
            padding: 16px;
            background: #fafafa;
            border-radius: 2px;
            margin-bottom: 32px;
            border: 1px solid #d9d9d9;
            font-size: 13px;
            line-height: 1.7;
        }
        .btn-group { 
            display: flex; 
            gap: 12px; 
        }
        .prev-btn, .copy-btn, .restart-btn { 
            flex: 1; 
            padding: 16px; 
            border-radius: 2px; 
            cursor: pointer; 
            font-size: 14px;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }
        .prev-btn { 
            background: #fff; 
            color: #1a1a1a; 
            border: 1px solid #d9d9d9; 
        }
        .prev-btn:hover {
            border-color: #1a1a1a;
        }
        .copy-btn { 
            background: #1a1a1a; 
            color: #fff; 
            border: 1px solid #1a1a1a;
        }
        .copy-btn:hover {
            background: #000;
            border-color: #000;
        }
        .restart-btn { 
            background: #fff; 
            color: #1a1a1a; 
            border: 1px solid #d9d9d9; 
        }
        .restart-btn:hover {
            border-color: #1a1a1a;
        }
    </style>
</head>
<body>
<div class="page-frame">
    <div class="brand-header">
        <div class="brand-name">BUFFALO BOXING</div>
        <div class="brand-series">Darwin Custom Series</div>
    </div>

    <div class="page-title">Final Result</div>

    <div class="final-price">Final Price: $<span id="finalPrice">380</span> / £<span id="finalPriceGBP">285</span></div>

    <div class="summary-box">
        <div class="summary-item">
            <span class="summary-label">Size:</span>
            <span class="summary-value" id="summarySize">10 oz</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">Leather:</span>
            <span class="summary-value" id="summaryLeather">Swift Cowhide</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">Colors:</span>
            <span class="summary-value" id="summaryColors">Custom</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">Custom Text:</span>
            <span class="summary-value" id="summaryText">None</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">Custom Font:</span>
            <span class="summary-value" id="summaryFont">None</span>
        </div>
    </div>

    <div class="copy-result" id="copyResult">
        <strong>Customization Summary:</strong><br>
        Size: <span id="copySize">10 oz</span><br>
        Leather: <span id="copyLeather">Swift Cowhide</span><br>
        Colors: <span id="copyColors">Custom</span><br>
        Custom Text: <span id="copyText">None</span><br>
        Final Price: $<span id="copyPrice">380</span> / £<span id="copyPriceGBP">285</span>
    </div>

    <div class="btn-group">
        <button class="prev-btn" id="prevBtn">BACK · Previous</button>
        <button class="copy-btn" id="copyBtn">COPY SUMMARY</button>
        <button class="restart-btn" id="restartBtn">RESTART</button>
    </div>
</div>

<script>
    const finalPriceEl = document.getElementById('finalPrice');
    const finalPriceGBPEl = document.getElementById('finalPriceGBP');
    const summarySize = document.getElementById('summarySize');
    const summaryLeather = document.getElementById('summaryLeather');
    const summaryColors = document.getElementById('summaryColors');
    const summaryText = document.getElementById('summaryText');
    const summaryFont = document.getElementById('summaryFont');
    const copyResult = document.getElementById('copyResult');
    const copyBtn = document.getElementById('copyBtn');
    const prevBtn = document.getElementById('prevBtn');
    const restartBtn = document.getElementById('restartBtn');

    function loadSummary() {
        const size = localStorage.getItem('customSize') || '10 oz';
        const leather = localStorage.getItem('leatherType') || 'Swift Cowhide';
        const areaColors = JSON.parse(localStorage.getItem('areaColors')) || {};
        const customText = localStorage.getItem('customText') || '';
        const customFont = localStorage.getItem('customFont') || '';
        
        const basePrice = Math.max(0, parseInt(localStorage.getItem('basePrice')) || 380);
        const basePriceGBP = Math.max(0, parseInt(localStorage.getItem('basePriceGBP')) || 285);
        const colorExtra = Math.max(0, parseInt(localStorage.getItem('colorExtra')) || 0);
        const colorExtraGBP = Math.max(0, parseInt(localStorage.getItem('colorExtraGBP')) || 0);
        const customExtra = Math.max(0, parseInt(localStorage.getItem('customExtra')) || 0);
        const customExtraGBP = Math.max(0, parseInt(localStorage.getItem('customExtraGBP')) || 0);
        
        const finalPrice = basePrice + colorExtra + customExtra;
        const finalPriceGBP = basePriceGBP + colorExtraGBP + customExtraGBP;
        
        finalPriceEl.innerText = finalPrice;
        finalPriceGBPEl.innerText = finalPriceGBP;
        
        summarySize.innerText = size;
        summaryLeather.innerText = leather;
        
        const colorCount = Object.values(areaColors).filter(c => c).length;
        summaryColors.innerText = colorCount > 0 ? `${colorCount} color(s)` : 'None';
        
        summaryText.innerText = customText || 'None';
        summaryFont.innerText = customFont || 'None';
        
        // Update copy text
        document.getElementById('copySize').innerText = size;
        document.getElementById('copyLeather').innerText = leather;
        document.getElementById('copyColors').innerText = colorCount > 0 ? `${colorCount} color(s)` : 'None';
        document.getElementById('copyText').innerText = customText || 'None';
        document.getElementById('copyPrice').innerText = finalPrice;
        document.getElementById('copyPriceGBP').innerText = finalPriceGBP;
    }

    function copyResult() {
        const text = copyResult.textContent;
        
        if (isSecureContext && navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Summary copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
                fallbackCopyTextToClipboard(text);
            });
        } else {
            fallbackCopyTextToClipboard(text);
        }
    }

    function fallbackCopyTextToClipboard(text) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-999999px';
        textArea.style.top = '-999999px';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        
        try {
            const successful = document.execCommand('copy');
            const msg = successful ? 'Summary copied to clipboard!' : 'Failed to copy';
            alert(msg);
        } catch (err) {
            console.error('Fallback: Oops, unable to copy', err);
            alert('Failed to copy summary');
        }
        
        document.body.removeChild(textArea);
    }

    prevBtn.onclick = () => { window.location.href = '4.customize.html'; };
    
    restartBtn.onclick = () => {
        if (confirm('Are you sure you want to restart? All selections will be lost.')) {
            localStorage.clear();
            window.location.href = '1.size.html';
        }
    };

    copyBtn.onclick = copyResult;

    loadSummary();
</script>
</body>
</html>
