<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-8">
    <title>4. Customize | BUFFALO BOXING</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            padding: 40px 20px; 
            max-width: 750px; 
            margin: 0 auto; 
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
        }
        .page-frame {
            background: #ffffff;
            border: 1px solid #1a1a1a;
            border-radius: 2px;
            padding: 48px 40px;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 48px;
            padding-bottom: 24px;
            border-bottom: 1px solid #1a1a1a;
        }
        .brand-name {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 3px;
            color: #1a1a1a;
        }
        .brand-series {
            font-size: 11px;
            letter-spacing: 4px;
            color: #666;
            margin-top: 6px;
            text-transform: uppercase;
        }
        .page-title { 
            font-size: 20px; 
            font-weight: 500; 
            margin-bottom: 24px;
            color: #1a1a1a;
            letter-spacing: 1px;
        }
        .current-price { 
            font-size: 14px; 
            color: #666; 
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1a1a1a;
        }
        .current-price span {
            font-size: 22px;
            font-weight: 500;
            color: #1a1a1a;
            margin-left: 8px;
        }
        .price-alert { 
            padding: 12px 16px; 
            background: #fafafa; 
            border: 1px solid #d9d9d9; 
            border-radius: 2px; 
            margin-bottom: 20px; 
            color: #1a1a1a; 
            font-size: 13px; 
            display: none; 
            line-height: 1.7;
        }
        .controls { 
            padding: 20px; 
            background: #fafafa; 
            border-radius: 2px;
            margin-bottom: 40px;
            border: 1px solid #d9d9d9;
        }
        .controls label {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        select, input { 
            padding: 10px 12px; 
            border: 1px solid #d9d9d9; 
            border-radius: 2px; 
            margin: 10px 0 20px; 
            width: 100%; 
            box-sizing: border-box;
            background: #fff;
            font-size: 14px;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.2s ease;
            font-family: inherit;
        }
        select:focus, input:focus {
            border-color: #1a1a1a;
        }
        .font-preview {
            padding: 12px 16px;
            background: #fff;
            border: 1px solid #d9d9d9;
            border-radius: 2px;
            margin-top: 10px;
            font-size: 16px;
            min-height: 48px;
            display: flex;
            align-items: center;
        }
        .font-preview::placeholder {
            color: #999;
        }
        .btn-group { 
            display: flex; 
            gap: 12px; 
        }
        .prev-btn, .next-btn { 
            flex: 1; 
            padding: 16px; 
            border-radius: 2px; 
            cursor: pointer; 
            font-size: 14px;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }
        .prev-btn { 
            background: #fff; 
            color: #1a1a1a; 
            border: 1px solid #d9d9d9; 
        }
        .prev-btn:hover {
            border-color: #1a1a1a;
        }
        .next-btn { 
            background: #1a1a1a; 
            color: #fff; 
            border: 1px solid #1a1a1a;
        }
        .next-btn:hover {
            background: #000;
            border-color: #000;
        }
    </style>
</head>
<body>
<div class="page-frame">
    <div class="brand-header">
        <div class="brand-name">BUFFALO BOXING</div>
        <div class="brand-series">Darwin Custom Series</div>
    </div>

    <div class="page-title">Customize</div>

    <div class="current-price">Current Price: $<span id="currentPrice">380</span> / £<span id="currentPriceGBP">285</span></div>
    <div class="price-alert" id="priceAlert"></div>

    <div class="controls">
        <div>
            <label>Custom Text (Max 12 characters)</label>
            <input type="text" id="customText" maxlength="12" placeholder="Enter text">
        </div>
        <div>
            <label>Select Font</label>
            <select id="fontSelect">
                <option value="Arial">Arial</option>
                <option value="Helvetica">Helvetica</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Georgia">Georgia</option>
                <option value="Verdana">Verdana</option>
                <option value="Courier New">Courier New</option>
            </select>
        </div>
        <div>
            <label>Font Preview</label>
            <div class="font-preview" id="fontPreview" contenteditable="false">Type text above to preview</div>
        </div>
    </div>

    <div class="btn-group">
        <button class="prev-btn" id="prevBtn">BACK · Previous</button>
        <button class="next-btn" id="nextBtn">NEXT · Result</button>
    </div>
</div>

<script>
    const customTextInput = document.getElementById('customText');
    const fontSelect = document.getElementById('fontSelect');
    const fontPreview = document.getElementById('fontPreview');
    const currentPriceEl = document.getElementById('currentPrice');
    const currentPriceGBPEl = document.getElementById('currentPriceGBP');
    const priceAlert = document.getElementById('priceAlert');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let basePrice = Math.max(0, parseInt(localStorage.getItem('basePrice')) || 380);
    let basePriceGBP = Math.max(0, parseInt(localStorage.getItem('basePriceGBP')) || 285);
    let colorExtra = Math.max(0, parseInt(localStorage.getItem('colorExtra')) || 0);
    let colorExtraGBP = Math.max(0, parseInt(localStorage.getItem('colorExtraGBP')) || 0);
    let customExtra = 0;
    let customExtraGBP = 0;

    function calculatePrice() {
        const text = customTextInput.value.trim();
        const font = fontSelect.value;
        
        if (text) {
            customExtra = 50;
            customExtraGBP = 40;
            priceAlert.textContent = `· Custom text: +$50 / £40`;
            priceAlert.style.display = 'block';
        } else {
            customExtra = 0;
            customExtraGBP = 0;
            priceAlert.style.display = 'none';
        }

        currentPriceEl.innerText = basePrice + colorExtra + customExtra;
        currentPriceGBPEl.innerText = basePriceGBP + colorExtraGBP + customExtraGBP;
        localStorage.setItem('customExtra', customExtra);
        localStorage.setItem('customExtraGBP', customExtraGBP);
    }

    function updatePreview() {
        const text = customTextInput.value;
        const font = fontSelect.value;
        
        if (text) {
            fontPreview.textContent = text;
            fontPreview.style.fontFamily = font;
        } else {
            fontPreview.textContent = 'Type text above to preview';
            fontPreview.style.fontFamily = 'inherit';
        }
    }

    customTextInput.addEventListener('input', () => {
        updatePreview();
        calculatePrice();
    });

    fontSelect.addEventListener('change', () => {
        updatePreview();
        calculatePrice();
    });

    prevBtn.onclick = () => { window.location.href = '3.color.html'; };

    nextBtn.onclick = () => {
        const text = customTextInput.value.trim();
        const font = fontSelect.value;
        
        localStorage.setItem('customText', text);
        localStorage.setItem('customFont', font);
        localStorage.setItem('customExtra', customExtra);
        localStorage.setItem('customExtraGBP', customExtraGBP);
        
        window.location.href = '5.result.html';
    };

    // Load saved values
    const savedText = localStorage.getItem('customText');
    const savedFont = localStorage.getItem('customFont');
    
    if (savedText) {
        customTextInput.value = savedText;
    }
    
    if (savedFont) {
        fontSelect.value = savedFont;
    }
    
    updatePreview();
    calculatePrice();
</script>
</body>
</html>
